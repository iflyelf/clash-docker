xz: &xz {type: select, proxies: [♻️ 自动选择, 🔮 负载均衡-轮询, 🔮 负载均衡-散列, 🔯 故障转移, 🎯 全球直连, 🎉 xiaonuo🛺, 🎉 xiaonuo, 🇹🇼 台湾🛺, 🇹🇼 台湾,  🇭🇰 香港🛺, 🇭🇰 香港, 🇯🇵 日本🛺, 🇯🇵 日本, 🇸🇬 新加坡🛺, 🇸🇬 新加坡, 🇰🇷 韩国🛺, 🇰🇷 韩国, 🇷🇺 俄罗斯🛺, 🇷🇺 俄罗斯, 🇨🇦 加拿大🛺, 🇨🇦 加拿大, 🇺🇸 美国🛺, 🇺🇸 美国, 🇬🇧 英国🛺, 🇬🇧 英国, 🇫🇷 法国🛺, 🇫🇷 法国, 🇩🇪 德国🛺, 🇩🇪 德国, 🇧🇷 巴西🛺, 🇧🇷 巴西, 🇳🇱 荷兰🛺, 🇳🇱 荷兰, 🚞 其它地区, 🌐 全部节点], interval: 30, lazy: true, tolerance: 10}
