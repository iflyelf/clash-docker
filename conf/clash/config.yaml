  - RULE-SET,Sony,🎮 游戏平台
  - RULE-SET,Steam,🎮 游戏平台
  - RULE-SET,NetEaseMusic,🎶 网易音乐
  ## 代理规则
  - RULE-SET,Dns,🚀 节点选择
  - RULE-SET,Telegram,📲 电报消息
  - RULE-SET,AI,💬 Ai平台
  - RULE-SET,OpenAi,💬 Ai平台
