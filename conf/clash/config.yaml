  # 功能分组
  - {name: 🌐 全部节点, type: select , include-all: true, exclude-type: "direct|reject", exclude-filter: "(?i)(?:公司|直连|广告|拦截)", interval: 30, lazy: true, tolerance: 10}
  - {name: ♻️ 自动选择, type: url-test, include-all: true, exclude-type: "direct|reject", exclude-filter: "(?i)(?:公司|直连|广告|拦截)", interval: 30, lazy: true, tolerance: 10}
  - {name: 🔯 故障转移, type: fallback, include-all: true, exclude-type: "direct|reject", exclude-filter: "(?i)(?:公司|直连|广告|拦截)", interval: 30, lazy: true, tolerance: 10}
  - {name: 🔮 负载均衡-轮询, type: load-balance, strategy:round-robin, include-all: true, exclude-type: "direct|reject", exclude-filter: "(?i)(?:公司|直连|广告|拦截)", interval: 30, lazy: true, tolerance: 10}
  - {name: 🔮 负载均衡-散列, type: load-balance, strategy:consistent-hashing, include-all: true,exclude-type: "direct|reject", exclude-filter: "(?i)(?:公司|直连|广告|拦截)", interval: 30, lazy: true, tolerance: 10}


# 规则
rules:
  # 本机回环直连，放在最前
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  # 本机 clash 端口，直接拒绝，避免回环 warning
  - DST-PORT,7892,REJECT
  - DST-PORT,7893,REJECT
  # 拒绝所有 IPv6（提到 RuleSet 之前）
  - IP-CIDR6,::/0,REJECT,no-resolve
  # 拒绝规则 RuleSet
  - RULE-SET,XiaoNuoReject,🛑 广告拦截
  - RULE-SET,BanAD,🛑 广告拦截
